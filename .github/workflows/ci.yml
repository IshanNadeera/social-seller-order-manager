# Continuous integration (docs/DEVELOPMENT.md §13.3). Runs on every pull request and on main.
# Four jobs run in parallel, so one failure never hides another:
#   checks       npm ci → lint → format check → typecheck → unit tests (no database)
#   integration  PostgreSQL service → Supabase roles → prisma migrate deploy → RLS check →
#                migration drift check → database tests
#   build        web and API production builds
#   audit        npm audit --audit-level=high
# Actions are pinned to full commit SHAs (the tag is in the comment) so a moved tag cannot change
# what runs here. Dependabot (F-phase) can bump them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Never ask npm to prompt or print funding/update notices in CI.
  CI: true
  NPM_CONFIG_FUND: false
  NPM_CONFIG_UPDATE_NOTIFIER: false

jobs:
  checks:
    name: Lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (exact lockfile)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        # Includes the structure, workspace, Supabase-config and CI-workflow checks (root `npm test`).
        run: npm test

  integration:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same major version as the local Supabase stack.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database and fake local values only; no real credentials anywhere.
      NODE_ENV: test
      PORT: '3000'
      LOG_LEVEL: silent
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_JWT_ISSUER: http://127.0.0.1:54321/auth/v1
      WEB_ORIGIN: http://localhost:5173
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (exact lockfile)
        run: npm ci
      - name: Create the Supabase API roles
        # Supabase databases have anon / authenticated / service_role; a plain PostgreSQL does not.
        # The migration must lock them out of the app schema, so they must exist before it runs.
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f scripts/ci/supabase-roles.sql
      - name: Apply migrations (prisma migrate deploy)
        run: npm run db:deploy -w apps/api
      - name: RLS on every app table, no API-role access (ADR-004)
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres -f scripts/ci/check-rls.sql
      - name: No schema change without a migration (prisma migrate diff)
        run: npm run db:check-drift -w apps/api
      - name: Integration tests
        run: npm run test:db -w apps/api

  build:
    name: Build web and API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public placeholders so the build matches a real one; staging and production set their own (F7).
      VITE_API_URL: http://localhost:3000/api/v1
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (exact lockfile)
        run: npm ci
      - name: Build web
        run: npm run build -w apps/web
      - name: Build API
        run: npm run build -w apps/api

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm audit (fails on high or critical)
        # Reads package-lock.json; no install needed.
        run: npm audit --audit-level=high
